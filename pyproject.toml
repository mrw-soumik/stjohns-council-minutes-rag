[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stjohns-council-minutes-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over City of St. John's Regular Council Meeting minutes, with page-level citations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mostafa Rafiur Wasib", email = "mostafa.wasib73@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.15,<2",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
local = ["mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
council-rag = "council_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs external services (set PGVECTOR_TEST_DSN for the pgvector store)",
    "model: needs the embedding model files (downloaded from the Hugging Face Hub on first use)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["RUF001", "RUF002", "RUF003"]  # minutes text legitimately contains typographic quotes and dashes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
